name: Revisão de acessibilidade sem publicação
on:
  push:
    branches: ['qa/acessibilidade-beta-1-0']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: npm install --no-save --no-package-lock axe-core@4.10.3
      - run: python qa/acessibilidade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acessibilidade-beta-1-0
          path: acessibilidade-qa.json
          retention-days: 14
