name: Preparar mídia real e validar edição estática (sem deploy)
on:
  push:
    branches: ['qa/midia-beta-1-0']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'playwright>=1.51,<2' && python -m playwright install --with-deps chromium
      - run: command -v ffmpeg && command -v ffprobe
      - run: python qa/capturar_portfolio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udi-midia-revisao
          path: |
            assets/screenshots/*.png
            assets/gifs/*.gif
            assets/videos/*.mp4
            qa-media-result.json
          retention-days: 14
      - name: Guardar somente mídias e resultado na branch privada de revisão
        run: |
          test "$(git branch --show-current)" = "qa/midia-beta-1-0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/screenshots/*.png assets/gifs/*.gif assets/videos/*.mp4 qa-media-result.json
          git diff --cached --stat
          git commit -m "media: capturas e gravação real do painel para revisão"
          git push origin HEAD:qa/midia-beta-1-0
