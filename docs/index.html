function fontes(){
 var groups=[
 ["JUCEMG / Agência Minas","Registros mercantis de constituição; MEI fora do universo apresentado.","https://www.agenciaminas.mg.gov.br/noticia/minas-gerais-teve-mais-de-114-mil-novas-empresas-abertas-em-2025-128761"],
 ["Ministério do Trabalho / Novo Caged","Movimentação e estoque de empregos formais. Revisões e conciliação necessárias.","https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/acoes-e-programas/programas-projetos-acoes-obras-e-atividades/estatisticas-trabalho/microdados-rais-e-caged"],

 '<div class="directory">'+groups.map(function(g){return '<div class="dir-card" style="cursor:default"><strong>'+h(g[0])+'</strong><p class="sub" style="margin:9px 0">'+h(g[1])+'</p><div class="mini">'+href(g[2],"Abrir portal ou publicação ↗")+'</div></div>'}).join("")+'</div>'+
 '<div class="section-label">Por que algumas métricas não aparecem?</div><div class="grid2"><div class="panel"><h2>Não misturar medidas diferentes</h2><p class="sub">Empresa constituída ≠ empresa ativa; estabelecimentos cadastrados ≠ inaugurações; saldo do emprego ≠ estoque de vínculos; investimento anunciado ≠ investimento realizado.</p></div><div class="panel"><h2>Não preencher o desconhecido</h2><p class="sub">Sem valor oficial para um subsetor? Exibimos a fonte candidata, as últimas notícias e a lacuna. Não colocamos zero nem estimamos crescimento para completar um gráfico.</p></div></div>'+
 '<section class="panel"><h2>Como um indicador passa a ser publicado como série</h2><p class="sub">1. Localizar fonte e licença → 2. Baixar original e registrar SHA-256 → 3. Confirmar recorte municipal e competência → 4. Verificar universo e deduplicação → 5. Conciliar totais e revisões → 6. Aprovação humana independente (P4).</p><p class="mini">A prévia HTML é <strong>offline</strong>: não consulta internet nem atualiza automaticamente. Cada link abre a página institucional no navegador, se houver conexão.</p></section>';

function csvString(rows){if(!rows.length)return "";var keys=Object.keys(rows[0]),safe=function(s,numeric){s=String(s==null?"":s);if(!(numeric&&/^-?\d+(?:\.\d+)?$/.test(s))&&/^\s*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};return "\uFEFF"+keys.map(function(k){return safe(k,false)}).join(",")+"\n"+rows.map(function(row){return keys.map(function(k){return safe(row[k],k==="valor")}).join(",")}).join("\n")}
